<!DOCTYPE html>
<html>
  <head>
    <title>
      variable
    </title>
  </head>
  <body>
    <script>
      var a = 10;
      var b = 20;
      var c = a + b;
      console.log(c);
      let variable=3;
      // let word use to create a variable that can be changed later in the program
      let variable1=4;
      let calculation=variable+variable1;
      console.log(calculation);
      console.log("hello world");
      const variable2=5;
      // const word use to create a variable that cannot be changed later in the program
      // variable2=6; // This will cause an error
      console.log(variable2);
      var variable3=7;
      console.log(variable3);
      console.log(typeof variable3);
    </script>
</html>

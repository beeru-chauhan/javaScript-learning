<!DOCTYPE html>
<html>
  <head>
    <title>
      variable
    </title>
  </head>
  <body>
    <script>
      var a = 10;
      var b = 20;
      var c = a + b;
      console.log(c);
      let variable=3;
      // let word use to create a variable that can be changed later in the program
      let variable1=4;
      let calculation=variable+variable1;
      console.log(calculation);
      console.log("hello world");
    </script>
